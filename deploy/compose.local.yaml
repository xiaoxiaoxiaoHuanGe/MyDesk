name: mydesk-standalone
services:
  mydesk:
    container_name: mydesk-standalone
    image: mydesk:1.0.0
    user: "${MYDESK_UID:-10001}:${MYDESK_GID:-10001}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8443:8443"
    volumes:
      - ../.local/standalone:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
