name: mydesk
services:
  mydesk:
    container_name: mydesk
    image: mydesk:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "mydesk", "--host", "127.0.0.1", "--port", "8787", "--data", "/data", "--trusted-proxy", "127.0.0.1"]
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: Asia/Shanghai
      MYDESK_UPDATE_DIR: /app-updates
    volumes:
      - ../data:/data
      - ../app-updates:/app-updates:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
