name: MyDesk CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p .local
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.mjs tests/standalone.test.mjs tests/step-plan.test.mjs tests/inbox.test.mjs
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f deploy/compose.server.yaml config --quiet
      - name: Validate Windows release helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-OfficialReleaseWizard.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - run: python scripts/build_release.py
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: MyDesk-source-${{ github.sha }}
          path: dist/MyDesk-*-source.zip
          retention-days: 30
          if-no-files-found: error
  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm exec --prefix frontend -- playwright-core install --with-deps chromium
      - run: npm run --prefix frontend test:browser
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate disposable debug signing key
        run: |
          mkdir -p .local/android
          keytool -genkeypair -keystore .local/android/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=MyDesk CI Debug'
      - name: Generate disposable local test certificate
        run: |
          python -m pip install cryptography
          python - <<'PY'
          import sys,shutil
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from local_tls import prepare_tls
          prepare_tls(Path('.local/standalone/tls'))
          target=Path('android/app/src/debug/res/raw')
          target.mkdir(parents=True,exist_ok=True)
          shutil.copyfile('.local/standalone/tls/mydesk-local-ca.crt',target/'mydesk_local_ca.crt')
          PY
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
        working-directory: android
      - name: Record APK checksum
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDesk-Android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/output-metadata.json
            android/app/build/outputs/apk/debug/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
