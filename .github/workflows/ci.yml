name: MyDesk CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p .local
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.mjs tests/standalone.test.mjs
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f deploy/compose.server.yaml config --quiet
      - run: python scripts/build_release.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate disposable local test certificate
        run: |
          python -m pip install cryptography
          python - <<'PY'
          import sys,shutil
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from local_tls import prepare_tls
          prepare_tls(Path('.local/standalone/tls'))
          target=Path('android/app/src/debug/res/raw')
          target.mkdir(parents=True,exist_ok=True)
          shutil.copyfile('.local/standalone/tls/mydesk-local-ca.crt',target/'mydesk_local_ca.crt')
          PY
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
        working-directory: android
