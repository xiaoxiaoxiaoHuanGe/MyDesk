<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#247855">
  <title>MyDesk · 我的工作台</title>
  <link rel="icon" href="/frontend/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/frontend/app.css">
</head>
<body>
  <main id="login" class="login-stage" hidden>
    <section class="login-card" aria-labelledby="login-title">
      <img class="login-logo" src="/frontend/icon.svg" width="60" height="60" alt="">
      <span class="eyebrow">你的个人工作台</span>
      <h1 id="login-title">登录 MyDesk</h1>
      <p class="muted">在一个地方，照看重要的事。</p>
      <form id="login-form">
        <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required>
        <label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="show-password" type="button" aria-pressed="false">显示</button></div>
        <p id="login-error" role="alert"></p>
        <button class="primary" type="submit">登录</button>
      </form>
      <p class="login-foot">个人状态 · 通知 · 快捷操作</p>
    </section>
  </main>
  <div id="application" hidden>
    <aside class="navigation" aria-label="主导航">
      <a class="nav-brand" href="#dashboard"><img src="/frontend/icon.svg" width="30" height="30" alt="">MyDesk</a>
      <nav><a href="#dashboard" data-page="dashboard">工作台</a><a href="#settings" data-page="settings">设置</a></nav>
      <div class="nav-bottom"><button id="theme" type="button">切换外观</button><span id="account-name"></span><button id="logout" type="button">退出登录</button></div>
    </aside>
    <main class="app-content">
      <div id="dashboard"><mydesk-card id="desk"></mydesk-card></div>
      <section id="settings" class="settings-page" hidden>
        <header><span class="eyebrow">MYDESK</span><h1>设置</h1><p class="muted">连接你的服务，选择提醒的方式。</p></header>
        <div id="settings-feedback" role="status"></div>
        <div id="settings-content"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/frontend/app.js"></script>
</body>
</html>
