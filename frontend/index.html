<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EF">
  <title>MyDesk</title>
  <link rel="icon" href="/frontend/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/frontend/app.css">
</head>
<body>
  <main id="login" class="login-stage" hidden>
    <section class="login-card" aria-labelledby="login-title">
      <img class="login-logo" src="/frontend/icon-192.png" width="64" height="64" alt="MyDesk">
      <span class="eyebrow">你的个人工作台</span>
      <h1 id="login-title">登录 MyDesk</h1>
      <p class="muted">在一个地方，照看重要的事。</p>
      <form id="login-form">
        <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required>
        <label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="show-password" type="button" aria-pressed="false">显示</button></div>
        <p id="login-error" role="alert"></p>
        <button class="primary" type="submit">登录</button>
      </form>
      <p class="login-foot">把重要的事，安放在这里。</p>
    </section>
  </main>
  <div id="application" hidden>
    <aside class="navigation" aria-label="主导航">
      <a class="nav-brand" href="#dashboard"><img src="/frontend/icon-192.png" width="40" height="40" alt=""><span>MyDesk<small>个人工作台</small></span></a>
      <nav>
        <a href="#dashboard" data-page="dashboard" data-icon="home" aria-label="工作台"><span>工作台</span></a>
        <a href="#reminders" data-page="reminders" data-icon="bell" aria-label="提醒"><span>提醒</span></a>
        <a href="#settings" data-page="settings" data-icon="settings" aria-label="设置"><span>设置</span></a>
      </nav>
      <div class="nav-bottom"><span class="nav-note">重要的事，一目了然。</span><a href="#settings" class="account-link"><span class="account-avatar">M</span><span id="account-name"></span><span data-icon="chevron"></span></a></div>
    </aside>
    <main class="app-content">
      <header class="page-header">
        <div class="header-date"><time id="today"></time><span class="connection" role="status" hidden><i></i>未连接</span></div>
        <h1 id="page-title">MyDesk</h1>
        <p id="page-description">把今天的事情，安静地安排好。</p>
        <span id="quote-credit"></span>
      </header>
      <section id="dashboard" aria-label="工作台"><mydesk-card id="desk"></mydesk-card></section>
      <section id="reminders" aria-label="提醒" hidden><mydesk-card id="reminders-desk"></mydesk-card></section>
      <section id="settings" class="settings-page" aria-label="设置" hidden><div id="settings-content"></div></section>
      <footer class="page-footer">MyDesk <span>把重要的事，安放在这里。</span></footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/frontend/app.js"></script>
</body>
</html>
